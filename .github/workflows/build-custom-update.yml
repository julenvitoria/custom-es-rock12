# Builds Retro-Go SD from sylverb's repo (external_cores by default) with this
# repo's changes on top, in four variants published together:
#
#   retro-go_update_reposo.bin           custom files + patches/*.patch
#                                        (power button = normal sleep, STOP2)
#   retro-go_update_apagado.bin          the above + patches/apagado/*.patch
#                                        (power button = full power-off, STANDBY)
#   retro-go_update_reposo_bateria.bin   reposo + patches/bateria/*.patch
#   retro-go_update_apagado_bateria.bin  apagado + patches/bateria/*.patch
#                                        (battery fixes under test, not yet
#                                        sent upstream)
#
# The bateria variants are only built while patches/bateria has patches.
#
# Custom files copied over upstream:
#   Core/Src/retro-go/i18n/rg_i18n_es_es.c        (Spanish translation)
#   Core/Inc/retro-go/fonts/font_cp1252_rock12.h  (rock12 font)
#
# Same builder image, feature flags and package contents as the official
# GitHub release: SD card, bank 2, and the installer homebrew
# (/homebrews/installer.bin) bundled in. The installer zip URL is read from
# upstream's flasher-artifacts.yml, so it follows whatever sylverb ships.
#
# Runs every day and only builds when there is something new: a new upstream
# commit, or a new commit in this repo. Each build is published as a GitHub
# release whose tag names both commits. It can also be run by hand from
# Actions -> "custom update" -> Run workflow.
name: custom update

on:
  schedule:
    - cron: '23 5 * * *'   # every day at 05:23 UTC
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "sylverb branch, tag or commit to build (e.g. external_cores, v2.0.0-rc2)"
        default: external_cores
        type: string
      force:
        description: "Build and publish even if this combination was already released"
        default: false
        type: boolean
      builder_image:
        description: "retro-go-sd builder image"
        default: sylverb/retro-go-sd-builder:v1.5
        type: string

permissions:
  contents: write   # create the release

concurrency:
  group: custom-update
  cancel-in-progress: false

env:
  UPSTREAM_REPO: sylverb/game-and-watch-retro-go-sd
  # Scheduled runs have no inputs: fall back to the defaults.
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'external_cores' }}
  BUILDER_IMAGE: ${{ inputs.builder_image || 'sylverb/retro-go-sd-builder:v1.5' }}
  CUSTOM_FILES: >-
    Core/Src/retro-go/i18n/rg_i18n_es_es.c
    Core/Inc/retro-go/fonts/font_cp1252_rock12.h
  # Keep in sync with COMMON_FLAGS in the official flasher-artifacts.yml.
  # Language blobs depend on CHEAT_CODES and INTFLASH_BANK, so these must
  # match the firmware.
  FLAGS: >-
    SD_CARD=1
    INTFLASH_BANK=2
    COVERFLOW=1
    CHEAT_CODES=1
    MAX_CHEAT_CODES=13
    ENABLE_SCREENSHOT=1
    SHARED_HIBERNATE_SAVESTATE=1
    DISABLE_SPLASH_SCREEN=1
    REMOTE_INPUT=1
    ZH_CN=1
    ZH_TW=1
    KO_KR=1
    JA_JP=1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom files (this repo)
        uses: actions/checkout@v5
        with:
          path: custom

      - name: Check for something new
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          url="https://github.com/$UPSTREAM_REPO"
          ref="$UPSTREAM_REF"
          # Resolve a branch, an annotated or lightweight tag, or take a
          # commit id as given.
          sha=$(git ls-remote "$url" "refs/heads/$ref" | cut -f1)
          [ -n "$sha" ] || sha=$(git ls-remote "$url" "refs/tags/$ref^{}" | cut -f1)
          [ -n "$sha" ] || sha=$(git ls-remote "$url" "refs/tags/$ref" | cut -f1)
          [ -n "$sha" ] || sha="$ref"
          custom_sha=$(git -C custom rev-parse HEAD)
          tag="es-rock12-${sha:0:7}-${custom_sha:0:7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$FORCE" = "true" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "Release $tag exists; force requested, rebuilding."
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Nothing new: release $tag already exists." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "New combination, building $tag."
          fi

      - name: Checkout upstream ${{ env.UPSTREAM_REF }}
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.check.outputs.sha }}
          path: src
          submodules: recursive
          # Full history + tags so `git describe` gives the firmware a real
          # version (e.g. v2.0.0-rc2-1-gabc1234).
          fetch-depth: 0
          fetch-tags: true

      - name: Apply custom files and common patches
        if: steps.check.outputs.build == 'true'
        working-directory: src
        run: |
          set -euo pipefail
          echo "UPSTREAM_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          # Installer homebrew zip the official release bundles. Taken from
          # upstream's own workflow so a new installer version is picked up.
          installer_url=$(sed -n 's/^ *INSTALLER_HOMEBREW_ZIP_URL: *//p' \
            .github/workflows/flasher-artifacts.yml 2>/dev/null | head -1 | tr -d "\"' " || true)
          if [ -z "$installer_url" ] || [ ! -f scripts/flasher/bundle_installer_homebrew.py ]; then
            echo "::warning::Upstream no longer defines the installer homebrew; packages will not include it."
            installer_url=""
          fi
          echo "INSTALLER_URL=$installer_url" >> "$GITHUB_ENV"
          # The font must keep the section marker upstream uses; otherwise the
          # build would not extract it to fonts/cp1252_rock12.bin.
          up_marker=$(grep -o 'FONT_DATA[A-Z0-9_]*' Core/Inc/retro-go/fonts/font_cp1252_rock12.h | head -1)
          my_marker=$(grep -o 'FONT_DATA[A-Z0-9_]*' ../custom/Core/Inc/retro-go/fonts/font_cp1252_rock12.h | head -1)
          if [ "$up_marker" != "$my_marker" ]; then
            echo "::error::Upstream font uses section marker '$up_marker' but the custom font uses '$my_marker'. Update the custom font header."
            exit 1
          fi
          for f in $CUSTOM_FILES; do
            [ -f "$f" ] || { echo "::error::$f no longer exists upstream"; exit 1; }
            cp "../custom/$f" "$f"
          done
          ../custom/.github/scripts/apply_patches.sh ../custom/patches
          # Commit locally so the version string names this build cleanly
          # instead of ending in a "dirty" marker. Nothing is pushed.
          if ! git diff --quiet; then
            git -c user.name="custom-build" -c user.email="custom-build@localhost" \
              commit -q -a -m "custom Spanish translation, rock12 font and common patches"
          fi

      - name: Build updater
        if: steps.check.outputs.build == 'true'
        working-directory: src
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/opt/workdir" \
            "$BUILDER_IMAGE" \
            bash -l -c 'make -j$(nproc) -C external/firmware_update'

      - name: Download installer homebrew
        if: steps.check.outputs.build == 'true' && env.INSTALLER_URL != ''
        run: |
          set -euo pipefail
          # Fetched once into a staging tree and merged into each variant's
          # package below, exactly as the official release does.
          mkdir -p _installer
          python3 src/scripts/flasher/bundle_installer_homebrew.py \
            --url "$INSTALLER_URL" --content _installer
          find _installer -type f -exec ls -l {} \;

      - name: Build variants
        if: steps.check.outputs.build == 'true'
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p ../_out
          : > ../_out/version.txt
          # Every variant starts from the same commit (custom files + common
          # patches) and adds its own patch sets on top.
          base=$(git rev-parse HEAD)
          variants="reposo apagado"
          if ls ../custom/patches/bateria/*.patch >/dev/null 2>&1; then
            variants="$variants reposo_bateria apagado_bateria"
          fi
          # Temporary colour tests for the battery icon (reposo only).
          for t in opcion1 opcion2; do
            if ls ../custom/patches/$t/*.patch >/dev/null 2>&1; then
              variants="$variants reposo_$t"
            fi
          done
          for variant in $variants; do
            echo "::group::Variant $variant"
            git reset -q --hard "$base"
            sets=""
            case "$variant" in
              *bateria*) sets="$sets bateria" ;;
            esac
            case "$variant" in
              *opcion1) sets="$sets bateria opcion1" ;;   # bateria + red nearest-match
              *opcion2) sets="$sets opcion2" ;;           # self-contained: CLUT slots + diagnostic
            esac
            case "$variant" in
              apagado*) sets="$sets apagado" ;;
            esac
            for set in $sets; do
              ../custom/.github/scripts/apply_patches.sh "../custom/patches/$set"
            done
            if ! git diff --quiet; then
              git -c user.name="custom-build" -c user.email="custom-build@localhost" \
                commit -q -a -m "variant $variant patches"
            fi
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/opt/workdir" \
              "$BUILDER_IMAGE" \
              bash -l -c "set -e
                make -j\$(nproc) $FLAGS create_sd_data build/gw_retro_go_intflash.bin" \
              2>&1 | tee "../build-$variant.log"
            # Package a copy of sd_content with the installer homebrew merged
            # in, so the build tree itself stays as upstream left it.
            rm -rf ../_pkg
            cp -a sd_content ../_pkg
            if [ -d ../_installer ]; then
              cp -a ../_installer/. ../_pkg/
            fi
            python3 scripts/flasher/make_update_package.py \
              --updater external/firmware_update/build/firmware_update.bin \
              --content ../_pkg \
              --output "../_out/retro-go_update_$variant.bin"
            # Later variants are incremental builds: the language blob is
            # already up to date and not regenerated, so keep the first stats.
            stats=$({ grep -A1 'rg_i18n_es_es.c ->' "../build-$variant.log" || true; } | tail -1 | sed 's/^ *//')
            if [ -n "$stats" ]; then es_stats=$stats; fi
            echo "retro-go_update_$variant.bin: $(git describe --tags --always) | es_es: ${es_stats:-unknown}" >> ../_out/version.txt
            echo "::endgroup::"
          done
          {
            echo "upstream: ${UPSTREAM_REPO}@${UPSTREAM_SHA} (${UPSTREAM_REF})"
            echo "custom:   ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            echo "flags:    ${FLAGS}"
            echo "installer: ${INSTALLER_URL:-none}"
          } >> ../_out/version.txt
          cat ../_out/version.txt
          {
            echo "### Retro-Go SD ${UPSTREAM_VERSION} + es-rock12"
            echo '```'
            cat ../_out/version.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: retro-go_update
          path: _out/
          if-no-files-found: error

      - name: Publish release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          EXISTS: ${{ steps.check.outputs.exists }}
        run: |
          set -euo pipefail
          list_patches() {
            for p in "$1"/*.patch; do
              if [ -e "$p" ]; then echo "  - \`$(basename "$p")\`"; fi
            done
          }
          {
            echo "Retro-Go SD **${UPSTREAM_VERSION}** de sylverb con la traducción española y la fuente rock12 de este repo, en dos variantes:"
            echo
            echo "- **\`retro-go_update_reposo.bin\`**: el botón power deja la consola en reposo (STOP2), como el firmware original."
            list_patches custom/patches
            echo "- **\`retro-go_update_apagado.bin\`**: el botón power apaga del todo la consola (STANDBY); al encender recupera la partida."
            list_patches custom/patches
            list_patches custom/patches/apagado
            if [ -e _out/retro-go_update_reposo_bateria.bin ]; then
              echo
              echo "**En pruebas:** las mismas dos variantes con los arreglos de batería que aún no se han enviado a sylverb:"
              echo
              echo "- **\`retro-go_update_reposo_bateria.bin\`** y **\`retro-go_update_apagado_bateria.bin\`**"
              list_patches custom/patches/bateria
            fi
            echo
            echo "Instalación: descarga la variante que quieras, **renómbrala a \`retro-go_update.bin\`**, cópiala a la raíz de la SD y enciende la consola."
            echo
            echo '```'
            cat _out/version.txt
            echo '```'
          } > notes.md
          files=(_out/retro-go_update_*.bin _out/version.txt)
          if [ "$EXISTS" = "true" ]; then
            gh release upload "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" "${files[@]}" \
              -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "${UPSTREAM_VERSION} + es-rock12" --notes-file notes.md --latest
          fi
